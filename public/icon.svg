<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Golden Crown Gradient -->
    <linearGradient id="goldCrown" x1="100" y1="120" x2="412" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Studio Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="120" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="4" fill="none" />

  <!-- Studio Ambient Rings -->
  <circle cx="256" cy="256" r="190" stroke="#facc15" stroke-opacity="0.15" stroke-width="2" />
  <circle cx="256" cy="256" r="140" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Golden Crown Symbol -->
  <g filter="url(#glow)">
    <!-- Crown Base -->
    <path
      d="M120 340H392L364 390H148L120 340Z"
      fill="url(#goldCrown)"
    />
    <!-- Crown Spikes -->
    <path
      d="M120 330L140 190L205 270L256 150L307 270L372 190L392 330H120Z"
      fill="url(#goldCrown)"
    />
    <!-- Jewels on spikes -->
    <circle cx="140" cy="180" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <circle cx="256" cy="140" r="20" fill="#f43f5e" stroke="#ffffff" stroke-width="3" />
    <circle cx="372" cy="180" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />

    <!-- Jewels on base -->
    <circle cx="200" cy="365" r="10" fill="#10b981" />
    <circle cx="256" cy="365" r="12" fill="#ffffff" />
    <circle cx="312" cy="365" r="10" fill="#10b981" />
  </g>
</svg>
