<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="120" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Gold Tassel Gradient -->
    <linearGradient id="goldGrad" x1="320" y1="200" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter for subtle drop glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none" />

  <!-- Background Decorative Rings -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2" />
  <circle cx="256" cy="256" r="130" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="8 8" />

  <!-- Central Cap & Rocket Upward Momentum Symbol -->
  <g filter="url(#glow)">
    <!-- Graduation Cap Top (Diamond) -->
    <path
      d="M256 128L76 216L256 304L436 216L256 128Z"
      fill="url(#accentGrad)"
    />

    <!-- Cap Thickness 3D Bevel -->
    <path
      d="M76 216L88 232L256 314L424 232L436 216L256 304L76 216Z"
      fill="#1e1b4b"
      opacity="0.6"
    />

    <!-- Cap Lower Skull Ring / Arc -->
    <path
      d="M136 270V330C136 376 188 412 256 412C324 412 376 376 376 330V270L256 328L136 270Z"
      fill="#ffffff"
      opacity="0.95"
    />

    <!-- Upward Growth Arrow inside Arc -->
    <path
      d="M256 250L216 310H242V366H270V310H296L256 250Z"
      fill="url(#bgGrad)"
    />

    <!-- Tassel Cord & Pendant -->
    <path
      d="M256 216C300 224 350 248 372 278"
      stroke="url(#goldGrad)"
      stroke-width="7"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="374" cy="286" r="8" fill="url(#goldGrad)" />
    <path
      d="M370 294L364 346C364 350 384 350 384 346L378 294Z"
      fill="url(#goldGrad)"
    />
    
    <!-- Central Cap Button -->
    <circle cx="256" cy="216" r="10" fill="#ffffff" />
  </g>
</svg>
